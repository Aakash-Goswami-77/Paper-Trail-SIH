services:
  db:
    image: postgres:16-alpine
    container_name: cert_postgres_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cert_verifier
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cert_verifier"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: cert_fastapi_app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@cert_postgres_db:5432/cert_verifier
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./temp_output:/app/temp_output

volumes:
  postgres_data:
